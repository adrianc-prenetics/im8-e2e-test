name: Playwright E2E Tests

on:
  schedule:
    - cron: '30 6 * * *'  # Daily at 6:30 AM UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push + dispatch on the same ref used to double-hit Shopify. Newest run wins.
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright green gate
        id: gate
        run: npx playwright test --project=chromium --grep-invert "@fail-closed-until-theme"
        env:
          CI: true
          SHOPIFY_SIGNATURE: ${{ secrets.SHOPIFY_SIGNATURE }}
          SHOPIFY_SIGNATURE_INPUT: ${{ secrets.SHOPIFY_SIGNATURE_INPUT }}
          SHOPIFY_SIGNATURE_AGENT: ${{ secrets.SHOPIFY_SIGNATURE_AGENT }}

      - name: Upload Playwright Report (gate)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-gate
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Results (gate)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-gate
          path: test-results/
          retention-days: 7

      - name: Send Telegram notification on gate failure
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ IM8 Playwright Tests FAILED!
          
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.event.head_commit.message || github.sha }}
          
          🔗 View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Run PDP gallery image budget
        if: success()
        run: npx playwright test --project=chromium tests/critical/pdp-gallery-image-budget.spec.ts -g "gallery thumbs stay under decode budget"
        env:
          CI: true
          SHOPIFY_SIGNATURE: ${{ secrets.SHOPIFY_SIGNATURE }}
          SHOPIFY_SIGNATURE_INPUT: ${{ secrets.SHOPIFY_SIGNATURE_INPUT }}
          SHOPIFY_SIGNATURE_AGENT: ${{ secrets.SHOPIFY_SIGNATURE_AGENT }}

      # Fail-closed until live hero srcset ≤1445. continue-on-error until the
      # theme ships (prod still 1946w). Runs after the green thumbs/lightbox check.
      - name: Run fail-closed PDP hero image cap
        if: success()
        continue-on-error: true
        run: npx playwright test --project=chromium tests/critical/pdp-gallery-image-budget.spec.ts --grep "@fail-closed-until-theme" --retries=0
        env:
          CI: true
          SHOPIFY_SIGNATURE: ${{ secrets.SHOPIFY_SIGNATURE }}
          SHOPIFY_SIGNATURE_INPUT: ${{ secrets.SHOPIFY_SIGNATURE_INPUT }}
          SHOPIFY_SIGNATURE_AGENT: ${{ secrets.SHOPIFY_SIGNATURE_AGENT }}

      - name: Upload Playwright Report (budget)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        with:
          name: playwright-report-budget
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Results (budget)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        with:
          name: test-results-budget
          path: test-results/
          retention-days: 7
